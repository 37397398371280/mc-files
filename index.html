<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting...</title>
  
    <link rel="icon" type="image/png" href="favicon.png">

    <script>
        const MAIN_DOMAIN = "https://docs.google.com/document/d/1lMB-HAESKTE01MSHVDyEs4aE0I20O1Pk2_n7zYoKZ7s/edit?usp=sharing";

        document.write(`<meta http-equiv="refresh" content="0;url=${MAIN_DOMAIN}">`);

        window.location.replace(MAIN_DOMAIN);
    </script>
</head>
<body>
    <p>If you are not redirected automatically, <a href="https://example.com">click here</a>.</p>
</body>
</html>
